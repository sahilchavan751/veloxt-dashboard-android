name: Auto Release on Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read Version from pubspec
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION_NAME"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version detected. Will build and release."
          fi

      - name: Set up Java 17
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        if: steps.check_tag.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Get Dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: flutter pub get

      - name: Setup Android Release Keystore
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Build Release APK
        if: steps.check_tag.outputs.exists == 'false'
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: 'upload-keystore.jks'
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || 'veloxtstreamsecret' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'veloxt' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'veloxtstreamsecret' }}

      - name: Generate Custom Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git fetch --tags --deepen=50
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "### What's Changed in this Update:" > changelog.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --no-merges --format="• %s" >> changelog.md
          else
            git log -n 10 --no-merges --format="• %s" >> changelog.md
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Veloxt v${{ steps.get_version.outputs.version }}
          body_path: changelog.md
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
